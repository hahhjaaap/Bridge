name: Core source inventory completeness

on:
  push:
    branches:
      - refactor/manager-safety-and-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: core-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate core source files and independent version boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from udb import __version__ as core_version
          from udb.release import ROOT_FILES

          source = Path(".").resolve()
          repository = source.parent
          missing = [name for name in ROOT_FILES if not (source / name).is_file()]
          print(f"CORE_REQUIRED_FILES={len(ROOT_FILES)}")
          print(f"CORE_MISSING_FILES={len(missing)}")
          for name in missing:
              print(f"CORE_MISSING: {name}")
          if missing:
              raise SystemExit("FAIL_CLOSED: core source inventory incomplete")

          proxy = json.loads((repository / "plugin.json").read_text(encoding="utf-8"))
          if proxy.get("name") != "universal-desktop-bridge" or not proxy.get("version"):
              raise SystemExit("FAIL_CLOSED: invalid repository-root proxy plugin manifest")
          if "plugin.json" in ROOT_FILES or "mcp.json" in ROOT_FILES:
              raise SystemExit("FAIL_CLOSED: proxy metadata must not be bundled with the standalone core EXE")

          print("PROXY_PLUGIN_VERSION=" + proxy["version"])
          print("CORE_EXE_VERSION=" + core_version)
          print("PROXY_METADATA_BUNDLED_WITH_CORE=NO")
          print("OFFLINE_VENDOR_STAGED=" + str((source / "vendor" / "python-runtime" / "python.exe").is_file()))
          print("CORE_SOURCE_INVENTORY_READY")
          PY
