name: package-and-regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[office,dev]"
      - run: python -m pytest
      - run: udb build
      - shell: bash
        run: python tools/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        id: artifact_upload
        continue-on-error: true
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          retention-days: 3
      - if: steps.artifact_upload.outcome == 'failure'
        run: echo "::warning::Build/test results are independent of artifact storage; upload failed, check Actions quota."
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[office,freeze]"
      - run: python tools/fetch_build_assets.py
      - run: udb build --exe
      - run: .\dist\udb.exe --version
      - run: .\dist\udb.exe tools
      - run: python tools/check_frozen.py dist/udb.exe
      - uses: actions/upload-artifact@v4
        id: artifact_upload
        continue-on-error: true
        with:
          name: windows-executable
          path: dist/*
          retention-days: 3
      - if: steps.artifact_upload.outcome == 'failure'
        run: echo "::warning::Build/test results are independent of artifact storage; upload failed, check Actions quota."
