name: package-and-regressions
on: [push, pull_request]
permissions:
  contents: read

# A refactor may produce many commits in a short time. Keep only the newest
# CI attempt per branch/event, while never cancelling main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[office,dev]"
      - run: python -m ruff check src tools tests
      - run: python tools/audit_repository.py --strict
      - run: python tools/check_import_boundaries.py
      - run: python -m pytest
      - run: udb build
      - shell: bash
        run: python tools/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        id: artifact_upload
        continue-on-error: true
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          retention-days: 3
      - if: steps.artifact_upload.outcome == 'failure'
        run: echo "::warning::Build/test results are independent of artifact storage; upload failed, check Actions quota."
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[office,freeze]"
      # Restore only public helpers; fetch_build_assets.py re-verifies SHA-256
      # even on a cache hit, so a corrupt/poisoned cache fails closed.
      - name: Restore pinned helper binaries
        id: helper_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build-assets/bin
          key: udb-public-helpers-${{ runner.os }}-${{ hashFiles('build-assets/components.json') }}
      - run: python tools/fetch_build_assets.py
      - name: Save verified helper binaries
        if: steps.helper_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build-assets/bin
          key: udb-public-helpers-${{ runner.os }}-${{ hashFiles('build-assets/components.json') }}
      - run: udb build --exe
      - run: .\dist\udb.exe --version
      - run: .\dist\udb.exe tools
      - run: python tools/check_frozen.py dist/udb.exe
      - name: Exercise managed update and rollback on Windows
        run: python tools/check_installer.py install.ps1 (Get-ChildItem dist/udb-*-windows-standalone.zip | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v4
        id: artifact_upload
        continue-on-error: true
        with:
          name: windows-executable
          path: dist/*
          retention-days: 3
      - if: steps.artifact_upload.outcome == 'failure'
        run: echo "::warning::Build/test results are independent of artifact storage; upload failed, check Actions quota."
