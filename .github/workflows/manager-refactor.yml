name: Manager refactor and Linux regressions

on:
  push:
    branches:
      - refactor/manager-safety-and-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manager-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test and analysis tools
        run: python -m pip install "pytest>=8,<10" "ruff==0.13.3" "mypy==1.18.2"
      - name: Format manager and prove AST unchanged
        run: python core-source/scripts/format_manager.py
      - name: Ruff, mypy and offline Linux regressions
        working-directory: core-source
        run: |
          python -m ruff format --check udb/manager.py
          python -m ruff check udb/manager.py udb/release_policy.py tests/test_manager_lifecycle.py
          python -m mypy --config-file pyproject.toml udb/manager.py udb/release_policy.py
          python -m pytest tests/test_manager_lifecycle.py tests/test_release.py tests/test_release_security.py -q
      - name: Commit AST-preserving formatting to review branch
        if: github.event_name == 'push'
        run: |
          git add core-source/udb/manager.py
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refactor: format Qt manager (AST-equivalent)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
