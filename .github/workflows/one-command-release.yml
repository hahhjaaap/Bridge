name: one-command-windows-release
on:
  push:
    branches: [release/one-command]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-command-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[office,dev,freeze]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python tools/fetch_build_assets.py
      - run: udb build --exe
      - run: python tools/check_frozen.py dist/udb.exe
      - run: python tools/check_installer.py install.ps1 dist/udb-0.9.1-windows-standalone.zip
      - name: Prepare download assets
        shell: pwsh
        run: |
          Copy-Item dist/udb-0.9.1-windows-standalone.zip dist/udb-windows-x64.zip
          $hash = (Get-FileHash dist/udb-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS'),$hash + '  udb-windows-x64.zip' + "`n",[Text.Encoding]::ASCII)
          Copy-Item install.ps1 dist/install.ps1 -Force
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v0.9.1 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v0.9.1 already exists; inspect before publishing another build.' }
          @'
          Windows x64 standalone UDB installer. Python, Node.js and Desktop Commander are not required.

          Run in your own PowerShell terminal:
          irm https://github.com/hahhjaaap/Universal-Desktop-Bridge/releases/latest/download/install.ps1 | iex

          The installer verifies the archive, installs for the current user, adds udb to PATH, and opens attended console setup. ChatGPT connectivity requires the user's own supported tunnel/account configuration. Computer access requires explicit local owner consent.

          Release checks: full pytest suite, copied-EXE acceptance, real local-HTTP installer download/reinstall/failure tests. SHA256 detects corruption; this initial build is not code-signed.
          '@ | Set-Content release-notes.md -Encoding utf8
          gh release create v0.9.1 dist/udb-windows-x64.zip dist/SHA256SUMS dist/install.ps1 --target "$env:GITHUB_SHA" --title 'UDB 0.9.1 - One-command Windows installer' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
