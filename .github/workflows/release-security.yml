name: Release package security tests

on:
  push:
    branches:
      - security/release-package-allowlist
  pull_request:
    paths:
      - "core-source/udb/release.py"
      - "core-source/udb/release_policy.py"
      - "core-source/Prepare-Vendor.py"
      - "core-source/tests/test_release*.py"
      - "core-source/.gitignore"
      - ".gitignore"
      - ".github/workflows/release-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Run Linux release regressions
        run: python -m pytest tests/test_release.py tests/test_release_security.py -q
