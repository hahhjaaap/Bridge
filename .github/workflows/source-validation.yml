name: Source validation

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: core-source
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Validate repository hygiene and version consistency
        run: python scripts/validate_source.py

      - name: Test local credential handling
        run: python -m pytest -q core-source/tests/test_credentials.py

      - name: Test proxy integration
        run: python test_integration.py

      - name: Test recovery, public catalog, and ConPTY
        run: python -m unittest -v test_backend_recovery test_tool_consolidation test_work_recovery test_conpty
